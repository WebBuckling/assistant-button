plugins {
    id 'com.android.application' version '8.9.2'
}

android {
    namespace 'com.strek.assistbutton'
    compileSdk 36

    defaultConfig {
        applicationId 'com.strek.assistbutton'
        // Wireless-debugging pairing needs Android 11 (API 30).
        minSdk 30
        targetSdk 36
        versionCode 9
        versionName '2.6'
    }

    // Keep the original flat layout (manifest, src/, res/ at the root).
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
        }
    }

    signingConfigs {
        // Local key (not committed). Generated by `keytool` on first setup, see README.
        local {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'debug'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.local
        }
        release {
            signingConfig signingConfigs.local
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }
}

dependencies {
    // On-device ADB client with Wireless debugging pairing (Apache-2.0 / GPL-3.0, dual licensed).
    implementation 'com.github.MuntashirAkon:libadb-android:3.1.1'
    // X.509 certificate generation for the ADB TLS key.
    implementation 'com.github.MuntashirAkon:sun-security-android:1.1'
    // TLS 1.3 with key export, required by ADB pairing.
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
}
